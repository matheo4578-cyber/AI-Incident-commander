apiVersion: v1
kind: Namespace
metadata:
  name: incident-commander
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-commander-api
  namespace: incident-commander
  annotations:
    eks.amazonaws.com/role-arn: ${API_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-commander-worker
  namespace: incident-commander
  annotations:
    eks.amazonaws.com/role-arn: ${WORKER_ROLE_ARN}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-commander
  namespace: incident-commander
data:
  LLM_MODE: ${LLM_MODE}
  OPENAI_MODEL: ${OPENAI_MODEL}
  AWS_REGION: ${AWS_REGION}
  AWS_DEFAULT_REGION: ${AWS_REGION}
  INCIDENT_QUEUE_URL: ${INCIDENT_QUEUE_URL}
  REPORTS_TABLE: ${REPORTS_TABLE}
  REPORTS_BUCKET: ${REPORTS_BUCKET}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: incident-commander
spec:
  replicas: 1
  selector: {matchLabels: {app: incident-commander, component: api}}
  template:
    metadata: {labels: {app: incident-commander, component: api}}
    spec:
      serviceAccountName: incident-commander-api
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ${IMAGE_URI}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: incident-commander}
            - secretRef: {name: incident-commander-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: incident-commander
spec:
  replicas: 1
  selector: {matchLabels: {app: incident-commander, component: worker}}
  template:
    metadata: {labels: {app: incident-commander, component: worker}}
    spec:
      serviceAccountName: incident-commander-worker
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ${IMAGE_URI}
          imagePullPolicy: IfNotPresent
          command: ["incident-worker"]
          envFrom:
            - configMapRef: {name: incident-commander}
            - secretRef: {name: incident-commander-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: incident-commander
spec:
  selector: {app: incident-commander, component: api}
  ports: [{name: http, port: 80, targetPort: http}]

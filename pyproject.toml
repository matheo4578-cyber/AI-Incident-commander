[project]
name = "ai-incident-commander"
version = "0.1.0"
description = "A LangGraph multi-agent system for evidence-based cloud incident investigation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sosa-IQ"}]
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "langchain-openai>=0.3,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "boto3-stubs[dynamodb,s3,sqs]>=1.35,<2",
  "httpx2>=2,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
incident-api = "incident_commander.api:run"
incident-worker = "incident_commander.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_commander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = [".", "src"]
filterwarnings = [
  "ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["incident_commander"]
